plugins {
    id 'dev.hybridlabs.fabric'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation("dev.hybridlabs.hapi:hapi-common-1.21.11:1.3.0")
    modImplementation("dev.hybridlabs.hapi:hapi-fabric-1.21.11:1.3.0")

    modApi "software.bernie.geckolib:geckolib-fabric-$geckolib_version"
    modApi("com.terraformersmc:modmenu:${modmenu_version}")
    modImplementation("com.terraformersmc:biolith-fabric:${biolith_version}") {
        exclude(group: "com.github.glitchfiend")
    }
    // Dev-only helpers do not have 1.21.11 builds yet.
    //modRuntimeOnly "io.github.flemmli97:debugutils:$minecraft_version-$debug_utils_version-fabric"
    //modImplementation "maven.modrinth:carpet:$carpet_version"
    //modRuntimeOnly "maven.modrinth:cyanide:4.1.1-fabric"
}

fabricApi {
    configureDataGeneration {
        setModId("$mod_id")
        outputDirectory = file("src/generated/resources")
        client = true
    }
}

// runDatagen writes into src/generated/resources, which is part of the main sourceset.
// Without this ordering Gradle rejects a combined 'build runDatagen' invocation with an
// implicit-dependency validation error and datagen never gets a chance to run.
tasks.withType(Jar).configureEach {
    if (name == 'sourcesJar') mustRunAfter tasks.named('runDatagen')
}

publishMods.platforms.configureEach {
    requires 'fabric-api', 'fabric-language-kotlin', 'geckolib', 'biolith', 'hybrid-api'
}
