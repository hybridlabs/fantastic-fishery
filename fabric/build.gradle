plugins {
    id 'dev.hybridlabs.fabric'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation("dev.hybridlabs.hapi:hapi-common-1.21.1:1.2.0")
    modImplementation("dev.hybridlabs.hapi:hapi-fabric-1.21.1:1.2.0")

    modApi "software.bernie.geckolib:geckolib-fabric-$geckolib_version"
    modApi("com.terraformersmc:modmenu:${modmenu_version}")
    modImplementation "maven.modrinth:lithostitched:${lithostitched_version}-fabric-21.1"
    // Lithostitched 1.8.x declares Apollib as a hard dependency but its bundled copy is not resolved by
    // Fabric Loader 0.17, so it has to be provided explicitly for the dev runs.
    modImplementation "maven.modrinth:apollib:1.2.0-fabric-21.1"
    // Apollib bundles json5-java as a nested jar that the dev runtime does not extract, so provide it directly.
    implementation "de.marhali:json5-java:3.0.0"
    modRuntimeOnly "io.github.flemmli97:debugutils:$minecraft_version-$debug_utils_version-fabric"
    modImplementation "maven.modrinth:carpet:$carpet_version"
    //modRuntimeOnly "maven.modrinth:cyanide:4.1.1-fabric"
}

fabricApi {
    configureDataGeneration {
        setModId("$mod_id")
        outputDirectory = file("src/generated/resources")
    }
}

publishMods.platforms.configureEach {
    requires 'fabric-api', 'fabric-language-kotlin', 'geckolib', 'lithostitched', 'hybrid-api'
}

// Dev-only server run that samples overworld biome placement and fails when one of our biomes never generates.
sourceSets {
    biomeSurvey {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom.runs.create('biomeSurvey') {
    server()
    configName = 'Biome Survey'
    source sourceSets.biomeSurvey
    runDir 'run/biome-survey'
    programArgs 'nogui'
}

def prepareBiomeSurvey = tasks.register('prepareBiomeSurvey') {
    def dir = file('run/biome-survey')
    doLast {
        delete(new File(dir, 'world'), new File(dir, 'biome-survey-report.txt'))
        new File(dir, 'mods').mkdirs()
        // Accepts the Minecraft EULA for this throwaway server
        new File(dir, 'eula.txt').text = 'eula=true\n'
        new File(dir, 'server.properties').text = 'level-seed=424242\nonline-mode=false\nserver-port=25598\nmax-tick-time=-1\n'
    }
}
tasks.named('runBiomeSurvey') { dependsOn prepareBiomeSurvey }
