modLoader = "kotlinforforge"

loaderVersion = "[4,)"
license = "${license}"
issueTrackerURL="https://github.com/hybridlabs/fantastic-fishery/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL="https://hybridlabs.net/"
iconFile = "${mod_id}:icon.png"
credits = '''${credits}'''
authors = "${mod_author}"
description = '''${description}'''
enumExtensions="META-INF/enumextensions.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[5.5.5,)"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "lithostitched"
type = "required"
versionRange = "[1.8.0,)"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "hapi"
type = "required"
versionRange = "[1.2.0,)"
side = "BOTH"